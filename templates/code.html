{% extends "base.html" %}

{% block content %}

<section class="card">

    <h2>🎁 رمز الهدية</h2>

    <p class="muted">
        أدخل رمز الهدية للحصول على رصيد Demo.
    </p>

    {% if message %}
        <div class="message">
            {{ message }}
        </div>
    {% endif %}

    <form action="/redeem" method="post">

        <label>رمز الهدية</label>

        <input
            type="text"
            name="code"
            placeholder="أدخل الرمز هنا"
            autocomplete="off"
            required
        >

        <button type="submit">
            استرداد الرمز
        </button>

    </form>

</section>

{% endblock %}
