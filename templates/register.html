{% extends "base.html" %}

{% block content %}

<section class="card">

    <h2>إنشاء حساب</h2>

    {% if message %}
        <div class="message">
            {{ message }}
        </div>
    {% endif %}

    <form method="post" action="/register">

        <label>اسم المستخدم</label>
        <input
            type="text"
            name="username"
            required
            autocomplete="username"
        >

        <label>البريد الإلكتروني</label>
        <input
            type="email"
            name="email"
            required
            autocomplete="email"
        >

        <label>كلمة المرور</label>
        <input
            type="password"
            name="password"
            required
            autocomplete="new-password"
        >

        <button type="submit">
            إنشاء الحساب
        </button>

    </form>

    <p class="muted">
        لديك حساب بالفعل؟
        <a href="/login">تسجيل الدخول</a>
    </p>

</section>

{% endblock %}
